name: Flen.img Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"
          yes | sdkmanager --licenses >/dev/null || true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: cargo-ndk
        run: cargo install cargo-ndk

      - name: Rust native library
        working-directory: rust
        run: |
          mkdir -p ../app/src/main/jniLibs
          cargo ndk -t arm64-v8a -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flen-img-build-debug
          path: |
            build.log
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

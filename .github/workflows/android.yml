name: Flen.img Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"
          yes | sdkmanager --licenses >/dev/null || true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: cargo-ndk
        run: cargo install cargo-ndk

      - name: Rust native library
        working-directory: rust
        run: |
          mkdir -p ../app/src/main/jniLibs
          cargo ndk -t arm64-v8a -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.4.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          /tmp/gradle/gradle-9.4.1/bin/gradle wrapper --gradle-version 9.4.1
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: flen-img-debug-apks
          path: app/build/outputs/apk/debug/*.apk
